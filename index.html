```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard Tester</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0b0b0f;
    color: #eee;
    font-family: Arial, sans-serif;
    padding: 30px 20px;
}

h1 {
    text-align: center;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

input,
select,
button {
    background: #18181f;
    color: white;
    border: 1px solid #33333d;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 15px;
}

button {
    cursor: pointer;
}

button:hover {
    border-color: #7655ff;
}

.main {
    max-width: 1250px;
    margin: auto;
}

/* ================= KEYBOARD ================= */

.keyboard-wrapper {
    width: 100%;
    overflow-x: auto;
    padding: 15px;
}

.keyboard {
    display: flex;
    flex-direction: column;
    gap: 7px;
    width: max-content;
    margin: auto;
}

.row {
    display: flex;
    gap: 7px;
}

.key {
    width: 55px;
    height: 55px;
    background: #18181f;
    border: 1px solid #30303a;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    user-select: none;
    box-shadow: 0 3px 0 #070709;
    transition: 0.04s;
}

.key.pressed {
    background: #744cff;
    border-color: #a28cff;
    box-shadow: 0 0 18px #744cff;
    transform: translateY(2px);
}

.wide-125 { width: 70px; }
.wide-150 { width: 84px; }
.wide-175 { width: 98px; }
.wide-200 { width: 112px; }
.wide-225 { width: 126px; }

.key.space {
    width: 300px;
}

/* ================= INFO ================= */

.info {
    max-width: 700px;
    margin: 20px auto;
    background: #121218;
    border: 1px solid #292933;
    border-radius: 12px;
    padding: 15px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.info-box {
    background: #1a1a22;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
}

.label {
    color: #777;
    font-size: 12px;
}

.value {
    margin-top: 5px;
    color: #bcaeff;
    font-weight: bold;
}

/* ================= TYPING ================= */

.typing {
    max-width: 900px;
    margin: 35px auto;
    background: #121218;
    border: 1px solid #292933;
    border-radius: 14px;
    padding: 22px;
}

.typing h2 {
    margin-top: 0;
}

.sample {
    background: #0c0c11;
    border: 1px solid #292933;
    border-radius: 10px;
    padding: 20px;
    font-size: 21px;
    line-height: 1.8;
    letter-spacing: .3px;
    min-height: 110px;
}

.sample span.correct {
    color: #8be28b;
}

.sample span.wrong {
    color: #ff6868;
    background: #401b1b;
}

.sample span.current {
    text-decoration: underline;
    text-decoration-thickness: 3px;
    text-underline-offset: 5px;
}

#typingInput {
    width: 100%;
    margin-top: 15px;
    height: 100px;
    resize: none;
    font-size: 18px;
    font-family: monospace;
    outline: none;
}

#typingInput:focus {
    border-color: #7655ff;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.stat {
    background: #1a1a22;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
}

.stat b {
    display: block;
    font-size: 22px;
    color: #bcaeff;
    margin-top: 5px;
}

@media(max-width:700px) {
    .info,
    .stats {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<h1>⌨ <span id="displayKeyboardName">AULA HERO 68 HE</span></h1>
<div class="subtitle">Keyboard Tester</div>

<div class="controls">

    <input
        id="keyboardName"
        type="text"
        value="AULA HERO 68 HE"
        placeholder="Tên bàn phím..."
    >

    <select id="layout">
        <option value="60">60%</option>
        <option value="65" selected>65%</option>
        <option value="75">75%</option>
        <option value="tkl">TKL</option>
        <option value="full">Full Size</option>
    </select>

    <button onclick="resetKeys()">Reset Keyboard</button>

</div>

<div class="main">

<div class="keyboard-wrapper">
    <div id="keyboard" class="keyboard"></div>
</div>

<div class="info">

    <div class="info-box">
        <div class="label">KEY</div>
        <div id="keyName" class="value">-</div>
    </div>

    <div class="info-box">
        <div class="label">CODE</div>
        <div id="keyCode" class="value">-</div>
    </div>

    <div class="info-box">
        <div class="label">STATUS</div>
        <div id="status" class="value">Waiting</div>
    </div>

</div>


<!-- ================= TYPING TEST ================= -->

<div class="typing">

    <h2>⌨ Typing Test</h2>

    <div class="controls" style="justify-content:flex-start">

        <select id="sampleSelect">
            <option value="english">English</option>
            <option value="gaming">Gaming</option>
            <option value="code">Code</option>
            <option value="random">Random</option>
        </select>

        <button onclick="newTest()">New Test</button>

    </div>

    <div id="sample" class="sample"></div>

    <textarea
        id="typingInput"
        placeholder="Bấm vào đây và bắt đầu gõ..."
        spellcheck="false"
    ></textarea>

    <div class="stats">

        <div class="stat">
            WPM
            <b id="wpm">0</b>
        </div>

        <div class="stat">
            Accuracy
            <b id="accuracy">100%</b>
        </div>

        <div class="stat">
            Correct
            <b id="correct">0</b>
        </div>

        <div class="stat">
            Time
            <b id="time">0s</b>
        </div>

    </div>

</div>

</div>


<script>

/* =====================================================
   KEYBOARD
===================================================== */

const keyboard = document.getElementById("keyboard");
const layoutSelect = document.getElementById("layout");

const keyName = document.getElementById("keyName");
const keyCode = document.getElementById("keyCode");
const status = document.getElementById("status");

const keyboardName = document.getElementById("keyboardName");
const displayKeyboardName =
    document.getElementById("displayKeyboardName");

const rows = [

[
["Escape","Esc"],
["F1","F1"],["F2","F2"],["F3","F3"],["F4","F4"],
["F5","F5"],["F6","F6"],["F7","F7"],["F8","F8"],
["F9","F9"],["F10","F10"],["F11","F11"],["F12","F12"]
],

[
["Backquote","`"],
["Digit1","1"],["Digit2","2"],["Digit3","3"],["Digit4","4"],
["Digit5","5"],["Digit6","6"],["Digit7","7"],["Digit8","8"],
["Digit9","9"],["Digit0","0"],
["Minus","-"],["Equal","="],
["Backspace","Backspace"]
],

[
["Tab","Tab"],
["KeyQ","Q"],["KeyW","W"],["KeyE","E"],["KeyR","R"],
["KeyT","T"],["KeyY","Y"],["KeyU","U"],["KeyI","I"],
["KeyO","O"],["KeyP","P"],
["BracketLeft","["],["BracketRight","]"],["Backslash","\\"]
],

[
["CapsLock","Caps"],
["KeyA","A"],["KeyS","S"],["KeyD","D"],["KeyF","F"],
["KeyG","G"],["KeyH","H"],["KeyJ","J"],["KeyK","K"],
["KeyL","L"],["Semicolon",";"],["Quote","'"],
["Enter","Enter"]
],

[
["ShiftLeft","Shift"],
["KeyZ","Z"],["KeyX","X"],["KeyC","C"],["KeyV","V"],
["KeyB","B"],["KeyN","N"],["KeyM","M"],
["Comma",","],["Period","."],["Slash","/"],
["ShiftRight","Shift"]
],

[
["ControlLeft","Ctrl"],
["MetaLeft","Win"],
["AltLeft","Alt"],
["Space","Space"],
["AltRight","Alt"],
["MetaRight","Win"],
["ContextMenu","Menu"],
["ControlRight","Ctrl"],
["ArrowLeft","←"],
["ArrowDown","↓"],
["ArrowUp","↑"],
["ArrowRight","→"]
]

];


function createKey(code,label) {

    const key = document.createElement("div");

    key.className = "key";
    key.id = "key-" + code;
    key.dataset.code = code;
    key.textContent = label;

    if(label === "Backspace")
        key.classList.add("wide-225");

    if(label === "Tab")
        key.classList.add("wide-125");

    if(label === "Caps")
        key.classList.add("wide-150");

    if(label === "Enter")
        key.classList.add("wide-175");

    if(label === "Shift")
        key.classList.add("wide-200");

    if(label === "Space")
        key.classList.add("space");

    return key;
}


function renderKeyboard() {

    keyboard.innerHTML = "";

    const selected = layoutSelect.value;

    rows.forEach((row,rowIndex) => {

        const rowElement = document.createElement("div");
        rowElement.className = "row";

        row.forEach(([code,label]) => {

            if(selected === "60") {

                if(rowIndex === 0) return;

                if([
                    "ArrowLeft",
                    "ArrowDown",
                    "ArrowUp",
                    "ArrowRight",
                    "MetaRight",
                    "ContextMenu"
                ].includes(code))
                    return;
            }

            if(selected === "65") {

                if(rowIndex === 0) return;

                if([
                    "MetaRight",
                    "ContextMenu"
                ].includes(code))
                    return;
            }

            rowElement.appendChild(createKey(code,label));

        });

        keyboard.appendChild(rowElement);

    });

}


document.addEventListener("keydown",e => {

    e.preventDefault();

    const key = document.getElementById("key-" + e.code);

    if(key)
        key.classList.add("pressed");

    keyName.textContent =
        e.key === " " ? "SPACE" : e.key;

    keyCode.textContent = e.code;

    status.textContent = "DOWN";

});


document.addEventListener("keyup",e => {

    const key = document.getElementById("key-" + e.code);

    if(key)
        key.classList.remove("pressed");

    status.textContent = "UP";

});


function resetKeys() {

    document
        .querySelectorAll(".key.pressed")
        .forEach(k => k.classList.remove("pressed"));

    keyName.textContent = "-";
    keyCode.textContent = "-";
    status.textContent = "Waiting";

}


layoutSelect.addEventListener("change",renderKeyboard);

keyboardName.addEventListener("input",() => {

    displayKeyboardName.textContent =
        keyboardName.value || "Keyboard Tester";

});

renderKeyboard();


/* =====================================================
   TYPING TEST
===================================================== */

const samples = {

english:
"The quick brown fox jumps over the lazy dog. Keyboard testing is fun and simple.",

gaming:
"Valorant is a tactical shooter where aim movement timing and communication matter.",

code:
"const keyboard = document.querySelector('#keyboard'); console.log('Keyboard test');",

random:
"Mechanical keyboards feel great when every key responds exactly when you expect it."
};


const sample = document.getElementById("sample");
const typingInput = document.getElementById("typingInput");
const sampleSelect = document.getElementById("sampleSelect");

const wpmDisplay = document.getElementById("wpm");
const accuracyDisplay = document.getElementById("accuracy");
const correctDisplay = document.getElementById("correct");
const timeDisplay = document.getElementById("time");

let currentText = "";
let startTime = null;
let timer = null;


function newTest() {

    clearInterval(timer);

    currentText =
        samples[sampleSelect.value];

    sample.innerHTML = "";

    [...currentText].forEach((char,index) => {

        const span = document.createElement("span");

        span.textContent = char;

        if(index === 0)
            span.classList.add("current");

        sample.appendChild(span);

    });

    typingInput.value = "";

    startTime = null;

    wpmDisplay.textContent = "0";
    accuracyDisplay.textContent = "100%";
    correctDisplay.textContent = "0";
    timeDisplay.textContent = "0s";

}


function updateTyping() {

    const typed = typingInput.value;

    if(!startTime && typed.length > 0) {

        startTime = Date.now();

        timer = setInterval(updateStats,100);

    }


    const spans = sample.querySelectorAll("span");

    let correct = 0;

    spans.forEach((span,index) => {

        span.classList.remove("correct","wrong","current");

        if(index < typed.length) {

            if(typed[index] === currentText[index]) {

                span.classList.add("correct");
                correct++;

            } else {

                span.classList.add("wrong");

            }

        }

    });


    if(typed.length < spans.length) {

        spans[typed.length]
            .classList.add("current");

    }


    correctDisplay.textContent = correct;


    const accuracy =
        typed.length === 0
        ? 100
        : Math.round((correct / typed.length) * 100);

    accuracyDisplay.textContent =
        accuracy + "%";


    if(typed.length >= currentText.length) {

        clearInterval(timer);

        typingInput.blur();

    }

}


function updateStats() {

    if(!startTime)
        return;

    const seconds =
        (Date.now() - startTime) / 1000;

    timeDisplay.textContent =
        Math.floor(seconds) + "s";


    const typed =
        typingInput.value.length;

    const words =
        typed / 5;

    const minutes =
        seconds / 60;

    const wpm =
        minutes > 0
        ? Math.round(words / minutes)
        : 0;

    wpmDisplay.textContent = wpm;

}


typingInput.addEventListener("input",updateTyping);

sampleSelect.addEventListener("change",newTest);

newTest();

</script>

</body>
</html>
