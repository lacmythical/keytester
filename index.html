<html lang="vi">
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

body {

button,
select,
input,

button,
select,

    background: #17171f;

    padding: 10px 14px;
    outline: none;
}

button {
    cursor: pointer;
}

button:hover {
    border-color: #7655ff;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #7655ff;
}

/* ================= HEADER ================= */

.header {
    text-align: center;
    padding: 35px 20px 20px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.header p {
    margin: 8px 0 0;
    color: #777;
}

/* ================= NAV ================= */

.tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 25px;
}

.tab {
    padding: 10px 18px;
}

.tab.active {
    background: #7655ff;
    border-color: #7655ff;
}

/* ================= MAIN ================= */

.container {
    width: min(1250px, 96%);
    margin: auto;
}

.panel {
    background: #111117;
    border: 1px solid #292933;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 25px;
}

/* ================= CONTROLS ================= */

.controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

/* ================= KEYBOARD ================= */

.keyboard-scroll {
    width: 100%;
    overflow-x: auto;
    padding: 15px 5px 25px;
}

.keyboard {
    width: max-content;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.row {
    display: flex;
    gap: 7px;
}

.key {
    width: 55px;
    height: 55px;

    background: #191921;
    border: 1px solid #30303a;
    border-radius: 7px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    font-weight: bold;

    user-select: none;

    box-shadow:
        0 3px 0 #060609;

    transition:
        background .04s,
        box-shadow .04s,
        transform .04s;
}

.key.pressed {
    background: #7655ff;
    border-color: #a693ff;

    box-shadow:
        0 0 8px #7655ff,
        0 0 20px #7655ff;

    transform: translateY(2px);
}

.w125 {
    width: 70px;
}

.w150 {
    width: 84px;
}

.w175 {
    width: 98px;
}

.w200 {
    width: 112px;
}

.w225 {
    width: 126px;
}

.space {
    width: 300px;
}

/* ================= INFO ================= */

.key-info {
    max-width: 700px;
    margin: auto;

    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;
}

.info-box {
    background: #191921;
    border-radius: 9px;
    padding: 13px;
    text-align: center;
}

.info-label {
    color: #777;
    font-size: 11px;
}

.info-value {
    margin-top: 6px;
    color: #bcaeff;
    font-weight: bold;
    word-break: break-word;
}

/* ================= TEST CARDS ================= */

.test-grid {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;
    margin-top: 15px;
}

.test-card {
    background: #191921;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
}

.test-card .label {
    color: #777;
    font-size: 12px;
}

.test-card .number {
    margin-top: 6px;
    font-size: 25px;
    font-weight: bold;
    color: #bcaeff;
}

/* ================= CPS ================= */

.cps-area {
    text-align: center;
}

.cps-button {
    width: 230px;
    height: 230px;

    border-radius: 50%;

    background: #191921;
    border: 2px solid #3a3a48;

    color: white;

    font-size: 25px;
    font-weight: bold;

    cursor: pointer;

    user-select: none;

    transition: .08s;
}

.cps-button:hover {
    border-color: #7655ff;
}

.cps-button:active {
    transform: scale(.96);
    background: #7655ff;
}

.cps-hint {
    color: #777;
    margin-top: 15px;
}

/* ================= TYPING ================= */

.typing-sample {
    background: #0a0a0e;

    border: 1px solid #292933;
    border-radius: 10px;

    padding: 20px;

    font-family: monospace;
    font-size: 21px;
    line-height: 1.8;

    min-height: 120px;

    margin-bottom: 15px;
}

.typing-sample span {
    color: #555;
}

.typing-sample span.correct {
    color: #8be28b;
}

.typing-sample span.wrong {
    color: #ff7070;
    background: #3b1919;
}

.typing-sample span.current {
    color: white;

    text-decoration:
        underline;

    text-decoration-thickness: 3px;

    text-underline-offset: 5px;
}

#typingInput {
    width: 100%;
    min-height: 110px;

    resize: vertical;

    background: #0c0c10;
    color: white;

    border: 1px solid #30303b;
    border-radius: 10px;

    padding: 15px;

    font-family: monospace;
    font-size: 18px;

    outline: none;
}

/* ================= HIDDEN ================= */

.hidden {
    display: none;
}

/* ================= MOBILE ================= */

@media(max-width: 750px) {

    .key-info {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .test-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .space {
        width: 200px;
    }

}
</style>

<script>

/* =====================================================
   KEYBOARD DATA
===================================================== */

const keyboardRows = [

[
["Escape","Esc"],

["F1","F1"],
["F2","F2"],
["F3","F3"],
["F4","F4"],

["F5","F5"],
["F6","F6"],
["F7","F7"],
["F8","F8"],

["F9","F9"],
["F10","F10"],
["F11","F11"],
["F12","F12"]
],

[

["Digit1","1"],
["Digit2","2"],
["Digit3","3"],

["Digit6","6"],
["Digit7","7"],

["Digit9","9"],
["Digit0","0"],

["Minus","-"],
["Equal","="],

["Backspace","Backspace"]
],

[

["KeyQ","Q"],
["KeyW","W"],

["KeyY","Y"],
["KeyU","U"],

["KeyO","O"],
["KeyP","P"],

["BracketLeft","["],
["BracketRight","]"],
["Backslash","\\"]
],

[
["CapsLock","Caps"],

["KeyA","A"],
["KeyS","S"],
["KeyD","D"],
["KeyF","F"],
["KeyG","G"],
["KeyH","H"],
["KeyJ","J"],
["KeyK","K"],
["KeyL","L"],

["Semicolon",";"],
["Quote","'"],

["Enter","Enter"]
],

[
["ShiftLeft","Shift"],

["KeyZ","Z"],
["KeyX","X"],
["KeyC","C"],
["KeyV","V"],
["KeyB","B"],
["KeyN","N"],
["KeyM","M"],

["Comma",","],
["Period","."],
["Slash","/"],

["ShiftRight","Shift"]
],

[
["ControlLeft","Ctrl"],
["MetaLeft","Win"],
["AltLeft","Alt"],

["Space","Space"],

["AltRight","Alt"],
["MetaRight","Win"],
["ContextMenu","Menu"],
["ControlRight","Ctrl"],

["ArrowLeft","←"],
["ArrowDown","↓"],
["ArrowUp","↑"],
["ArrowRight","→"]
]

];


/* =====================================================
   KEYBOARD RENDER
===================================================== */

const keyboard =
    document.getElementById("keyboard");

const layout =
    document.getElementById("layout");


function makeKey(code,label) {

    const key =
        document.createElement("div");

    key.className = "key";

    key.id = "key-" + code;

    key.dataset.code = code;

    key.textContent = label;


    if(label === "Backspace")
        key.classList.add("w225");

    if(label === "Tab")
        key.classList.add("w125");

    if(label === "Caps")
        key.classList.add("w150");

    if(label === "Enter")
        key.classList.add("w175");

    if(label === "Shift")
        key.classList.add("w200");

    if(label === "Space")
        key.classList.add("space");


    return key;
}


function renderKeyboard() {

    keyboard.innerHTML = "";

    const selected =
        layout.value;


    keyboardRows.forEach(
        (row,rowIndex) => {

            const rowElement =
                document.createElement("div");

            rowElement.className = "row";


            row.forEach(
                ([code,label]) => {

                    /* 60% */

                    if(selected === "60") {

                        if(rowIndex === 0)
                            return;

                        if([
                            "ArrowLeft",
                            "ArrowDown",
                            "ArrowUp",
                            "ArrowRight",
                            "MetaRight",
                            "ContextMenu"
                        ].includes(code))
                            return;
                    }


                    /* 65% */

                    if(selected === "65") {

                        if(rowIndex === 0)
                            return;

                        if([
                            "MetaRight",
                            "ContextMenu"
                        ].includes(code))
                            return;
                    }


                    const key =
                        makeKey(code,label);

                    rowElement.appendChild(key);

                }
            );


            keyboard.appendChild(rowElement);

        }
    );

}


renderKeyboard();

layout.addEventListener(
    "change",
    renderKeyboard
);


/* =====================================================
   KEYBOARD EVENTS
===================================================== */

const infoKey =
    document.getElementById("infoKey");

const infoCode =
    document.getElementById("infoCode");

const infoKeyCode =
    document.getElementById("infoKeyCode");

const infoStatus =
    document.getElementById("infoStatus");


document.addEventListener(
    "keydown",
    e => {

        /*
         * KHÔNG dùng preventDefault ở đây.
         * Vì nó sẽ chặn textarea typing.
         */

        const key =
            document.getElementById(
                "key-" + e.code
            );


        if(key)
            key.classList.add("pressed");


        infoKey.textContent =
            e.key === " "
            ? "SPACE"
            : e.key;

        infoCode.textContent =
            e.code;

        infoKeyCode.textContent =
            e.keyCode;

        infoStatus.textContent =
            "DOWN";

    }
);


document.addEventListener(
    "keyup",
    e => {

        const key =
            document.getElementById(
                "key-" + e.code
            );


        if(key)
            key.classList.remove("pressed");


        infoStatus.textContent =
            "UP";

    }
);


/* =====================================================
   KEYBOARD RESET
===================================================== */

document
    .getElementById("resetKeyboard")
    .addEventListener(
        "click",
        () => {

            document
                .querySelectorAll(
                    ".key.pressed"
                )
                .forEach(
                    key =>
                        key.classList
                            .remove("pressed")
                );


            infoKey.textContent = "-";
            infoCode.textContent = "-";
            infoKeyCode.textContent = "-";
            infoStatus.textContent =
                "Waiting";

        }
    );


/* =====================================================
   KEYBOARD NAME
===================================================== */

const keyboardName =
    document.getElementById(
        "keyboardName"
    );

const displayKeyboardName =
    document.getElementById(
        "displayKeyboardName"
    );


keyboardName.addEventListener(
    "input",
    () => {

        displayKeyboardName.textContent =
            keyboardName.value ||
            "Keyboard Tester";

    }
);


/* =====================================================
   CPS TEST
===================================================== */

const cpsButton =
    document.getElementById(
        "cpsButton"
    );

const cpsDuration =
    document.getElementById(
        "cpsDuration"
    );

const cpsValue =
    document.getElementById(
        "cpsValue"
    );

const clickCount =
    document.getElementById(
        "clickCount"
    );

const cpsTime =
    document.getElementById(
        "cpsTime"
    );

const cpsStatus =
    document.getElementById(
        "cpsStatus"
    );

const resetCps =
    document.getElementById(
        "resetCps"
    );


let cpsClicks = 0;
let cpsStart = null;
let cpsTimer = null;
let cpsRunning = false;


function resetCPS() {

    clearInterval(cpsTimer);

    cpsClicks = 0;
    cpsStart = null;
    cpsRunning = false;

    cpsValue.textContent = "0";
    clickCount.textContent = "0";
    cpsTime.textContent = "0.0s";
    cpsStatus.textContent = "Ready";

}


function finishCPS() {

    if(!cpsRunning)
        return;


    cpsRunning = false;

    clearInterval(cpsTimer);


    const duration =
        Number(cpsDuration.value);


    const cps =
        cpsClicks / duration;


    cpsValue.textContent =
        cps.toFixed(2);

    cpsTime.textContent =
        duration.toFixed(1) + "s";

    cpsStatus.textContent =
        "Finished";

}


cpsButton.addEventListener(
    "click",
    () => {

        if(!cpsRunning) {

            resetCPS();

            cpsRunning = true;

            cpsStart =
                performance.now();

            cpsStatus.textContent =
                "Running";

            cpsClicks = 1;

        } else {

            cpsClicks++;

        }


        clickCount.textContent =
            cpsClicks;


        const duration =
            Number(cpsDuration.value);


        const elapsed =
            (performance.now() -
                cpsStart) / 1000;


        cpsTime.textContent =
            Math.min(
                elapsed,
                duration
            ).toFixed(1) + "s";


        if(elapsed >= duration)
            finishCPS();

    }
);


/* CPS timer */

cpsTimer = setInterval(
    () => {

        if(!cpsRunning)
            return;


        const duration =
            Number(cpsDuration.value);


        const elapsed =
            (performance.now() -
                cpsStart) / 1000;


        cpsTime.textContent =
            Math.min(
                elapsed,
                duration
            ).toFixed(1) + "s";


        if(elapsed >= duration)
            finishCPS();

    },
    50
);


resetCps.addEventListener(
    "click",
    resetCPS
);


/* =====================================================
   TYPING TEST
===================================================== */

const samples = {

    english:
    "The quick brown fox jumps over the lazy dog. Keyboard testing is simple and fun.",

    gaming:
    "Valorant is a tactical shooter where aim movement timing and communication matter.",

    code:
    "const keyboard = document.querySelector('#keyboard'); console.log('Keyboard test');",

    random:
    "Mechanical keyboards feel great when every key responds exactly when you expect it."

};


const sampleSelect =
    document.getElementById(
        "sampleSelect"
    );

const typingSample =
    document.getElementById(
        "typingSample"
    );

const typingInput =
    document.getElementById(
        "typingInput"
    );

const wpm =
    document.getElementById("wpm");

const accuracy =
    document.getElementById(
        "accuracy"
    );

const correct =
    document.getElementById(
        "correct"
    );

const wrong =
    document.getElementById(
        "wrong"
    );

const typingTime =
    document.getElementById(
        "typingTime"
    );


let typingText = "";
let typingStart = null;
let typingTimer = null;


function newTypingTest() {

    clearInterval(typingTimer);

    typingText =
        samples[
            sampleSelect.value
        ];


    typingSample.innerHTML = "";


    [...typingText].forEach(
        (character,index) => {

            const span =
                document.createElement(
                    "span"
                );

            span.textContent =
                character;


            if(index === 0)
                span.classList
                    .add("current");


            typingSample
                .appendChild(span);

        }
    );


    typingInput.value = "";

    typingStart = null;


    wpm.textContent = "0";
    accuracy.textContent = "100%";
    correct.textContent = "0";
    wrong.textContent = "0";
    typingTime.textContent = "0s";

}


function updateTyping() {

    const typed =
        typingInput.value;


    if(
        typed.length > 0 &&
        !typingStart
    ) {

        typingStart =
            performance.now();


        typingTimer =
            setInterval(
                updateTypingStats,
                100
            );

    }


    const spans =
        typingSample
            .querySelectorAll("span");


    let correctCount = 0;
    let wrongCount = 0;


    spans.forEach(
        (span,index) => {

            span.classList.remove(
                "correct",
                "wrong",
                "current"
            );


            if(index < typed.length) {

                if(
                    typed[index] ===
                    typingText[index]
                ) {

                    span.classList
                        .add("correct");

                    correctCount++;

                } else {

                    span.classList
                        .add("wrong");

                    wrongCount++;

                }

            }

        }
    );


    if(
        typed.length <
        spans.length
    ) {

        spans[
            typed.length
        ].classList.add("current");

    }


    correct.textContent =
        correctCount;

    wrong.textContent =
        wrongCount;


    const totalTyped =
        typed.length;


    const acc =
        totalTyped === 0
        ? 100
        : (
            correctCount /
            totalTyped
        ) * 100;


    accuracy.textContent =
        Math.round(acc) + "%";


    if(
        typed.length >=
        typingText.length
    ) {

        clearInterval(
            typingTimer
        );

        updateTypingStats();

    }

}


function updateTypingStats() {

    if(!typingStart)
        return;


    const elapsed =
        (
            performance.now() -
            typingStart
        ) / 1000;


    typingTime.textContent =
        Math.floor(elapsed) + "s";


    const typed =
        typingInput.value.length;


    const minutes =
        elapsed / 60;


    const calculatedWPM =
        minutes > 0
        ? (
            typed / 5
        ) / minutes
        : 0;


    wpm.textContent =
        Math.round(
            calculatedWPM
        );

}


typingInput.addEventListener(
    "input",
    updateTyping
);


sampleSelect.addEventListener(
    "change",
    newTypingTest
);


document
    .getElementById("newTyping")
    .addEventListener(
        "click",
        newTypingTest
    );


newTypingTest();

                    )

);
